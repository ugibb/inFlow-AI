# inFlow AI — 宝塔 Nginx 反向代理配置模板
#
# 使用方式（宝塔 Linux 面板 11.x）：
#   1. 网站 → 添加站点 → 填写你的域名（如 inflow.example.com）
#   2. 站点设置 → 反向代理 → 添加反向代理
#   3. 目标 URL 填 http://127.0.0.1:8080
#   4. 将下方 location 块粘贴到「配置文件」中（替换默认 proxy 段）
#   5. 站点设置 → SSL → 申请 Let's Encrypt 证书并开启强制 HTTPS
#
# 注意：client_max_body_size 需 ≥ 500m，以支持 PDF/视频等大文件上传。

location / {
    proxy_pass http://127.0.0.1:8080;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_cache_bypass $http_upgrade;

    # AI 生成类接口（Spark 等）可能耗时较长
    proxy_read_timeout 600s;
    proxy_connect_timeout 600s;
    proxy_send_timeout 600s;
}

# 大文件上传（PDF / 视频等）
client_max_body_size 500m;
