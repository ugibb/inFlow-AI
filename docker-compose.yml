services:
  nginx:
    image: nginx:alpine
    container_name: trove-nginx
    volumes:
      - ./03-src/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
      - frontend
    restart: unless-stopped

  postgres:
    image: pgvector/pgvector:pg16
    container_name: trove-db
    environment:
      POSTGRES_DB: trove
      POSTGRES_USER: trove
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./03-src/backend/app/core/migrations:/docker-entrypoint-initdb.d:ro
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: trove-redis
    restart: unless-stopped

  backend:
    build:
      context: ./03-src/backend
      dockerfile: Dockerfile
    container_name: trove-backend
    image: trove-backend:latest
    env_file:
      - .env
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 1
    environment:
      # 仅保留 compose 拼装项；API Key 等一律由 env_file: .env 注入（避免 ${VAR:-} 空值覆盖 env_file）
      DATABASE_URL: postgresql+asyncpg://trove:${POSTGRES_PASSWORD}@postgres:5432/trove
      DATABASE_URL_SYNC: postgresql://trove:${POSTGRES_PASSWORD}@postgres:5432/trove
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY in .env}
      LOG_DIR: log
      LOG_TO_STDOUT: "1"
      TROVE_ENV: production
    depends_on:
      - postgres
      - redis
    volumes:
      # Persist user-configured LLM/embedding settings across container restarts
      - ./03-src/backend/app/config_store.json:/app/app/config_store.json
    restart: unless-stopped

  # OPTIONAL: WeChat bot worker — uncomment if you have wechat bot credentials set up.
  # Requires SERVICE_TOKEN_WECHAT_BOT in .env and wechat_accounts seeded via the API.
  # wechat-bot:
  #   image: trove-backend:latest
  #   container_name: trove-wechat-bot
  #   command: python -m app.extensions.wechat.bot
  #   environment:
  #     DATABASE_URL: postgresql+asyncpg://trove:${POSTGRES_PASSWORD}@postgres:5432/trove
  #     TROVE_BASE: http://backend:8000
  #     TROVE_TOKEN: ${SERVICE_TOKEN_WECHAT_BOT:-}
  #   depends_on:
  #     - backend
  #     - postgres
  #   restart: unless-stopped

  frontend:
    build:
      context: ./03-src/frontend
      dockerfile: Dockerfile
    container_name: trove-frontend
    environment:
      NEXT_PUBLIC_API_URL: /api
      TROVE_ENV: production
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  pgdata:
