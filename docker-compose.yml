services:
  nginx:
    image: nginx:alpine
    container_name: inflow-nginx
    volumes:
      - ./03-src/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
    extra_hosts:
      # backend 改为宿主直跑（直接代码部署），nginx 容器经 host-gateway 反代宿主机 8000。
      # 若切回 Docker backend 容器，需把 extra_hosts 移除并恢复 nginx.conf 的 backend:8000。
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  postgres:
    image: pgvector/pgvector:pg16
    container_name: inflow-db
    environment:
      # Keep database/user lowercase to match backend DSN and avoid
      # InvalidCatalogNameError (database "inflow" does not exist) on fresh volumes.
      POSTGRES_DB: inflow
      POSTGRES_USER: inflow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    ports:
      # 本地 worker 直连云端 PG 作任务总线。仅允许安全组白名单来源
      #（本地 Mac 公网 IP），切勿用 0.0.0.0/0 放行公网。
      - "0.0.0.0:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./03-src/backend/app/core/migrations:/docker-entrypoint-initdb.d:ro
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: inflow-redis
    ports:
      # backend 改为宿主直跑（直接代码部署），经 127.0.0.1 访问 redis 容器；仅本机回环，不暴露公网。
      - "127.0.0.1:6379:6379"
    restart: unless-stopped

  # ── backend（直接代码部署模式已注释）──────────────────────────────
  # backend 改为宿主直跑：./start-server.sh（uvicorn app.main:app --port 8000）。
  # 需要切回 Docker 容器方式时，取消本段注释，并：
  #   1. 恢复 nginx.conf 的 $upstream_backend="http://backend:8000"（去掉 host.docker.internal）
  #   2. 恢复 frontend / nginx 对 backend 的 depends_on
  #   3. 恢复 baota.yml 的 wechat-bot 服务
  # backend:
  #   build:
  #     context: ./03-src/backend
  #     dockerfile: Dockerfile
  #   container_name: inflow-backend
  #   image: inflow-backend:latest
  #   env_file:
  #     - .env
  #   command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 1
  #   environment:
  #     DATABASE_URL: postgresql+asyncpg://inflow:${POSTGRES_PASSWORD}@postgres:5432/inflow
  #     DATABASE_URL_SYNC: postgresql://inflow:${POSTGRES_PASSWORD}@postgres:5432/inflow
  #     REDIS_URL: redis://redis:6379/0
  #     SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY in .env}
  #     LOG_DIR: log
  #     LOG_TO_STDOUT: "1"
  #     inFlow_ENV: production
  #   depends_on:
  #     - postgres
  #     - redis
  #   volumes:
  #     # Persist user-configured LLM/embedding settings across container restarts
  #     - ./03-src/backend/app/config_store.json:/app/app/config_store.json
  #     # Pipeline artifacts — host path from INFLOW_PIPELINE_DATA_DIR (see .env.example)
  #     - ${INFLOW_PIPELINE_DATA_DIR:-./03-src/backend/data}:/app/data
  #   restart: unless-stopped

  # OPTIONAL: WeChat bot worker — uncomment if you have wechat bot credentials set up.
  # Requires SERVICE_TOKEN_WECHAT_BOT in .env and wechat_accounts seeded via the API.
  # wechat-bot:
  #   image: inflow-backend:latest
  #   container_name: inflow-wechat-bot
  #   command: python -m app.extensions.wechat.bot
  #   environment:
  #     DATABASE_URL: postgresql+asyncpg://inflow:${POSTGRES_PASSWORD}@postgres:5432/inflow
  #     inFlow_BASE: http://backend:8000
  #     inFlow_TOKEN: ${SERVICE_TOKEN_WECHAT_BOT:-}
  #   depends_on:
  #     - backend
  #     - postgres
  #   volumes:
  #     - ./03-src/backend/app/config_store.json:/app/app/config_store.json
  #     - ${INFLOW_PIPELINE_DATA_DIR:-./03-src/backend/data}:/app/data
  #   restart: unless-stopped

  frontend:
    build:
      context: ./03-src/frontend
      dockerfile: Dockerfile
    container_name: inflow-frontend
    environment:
      NEXT_PUBLIC_API_URL: /api
      inFlow_ENV: production
    restart: unless-stopped

volumes:
  pgdata:
