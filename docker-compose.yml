services:
  nginx:
    image: nginx:alpine
    container_name: inflow-nginx
    ports:
      # 宝塔面板 Nginx 已占 80/443：容器 Nginx 仅绑本机回环 8080，
      # 对外 HTTPS 由宝塔「网站 → 反向代理」转发到 127.0.0.1:8080。
      # 非宝塔环境可改为 "80:80" 直接对外。
      - "127.0.0.1:8080:80"
    volumes:
      - ./03-src/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
    extra_hosts:
      # backend 改为宿主直跑（直接代码部署），nginx 容器经 host-gateway 反代宿主机 8000。
      # 若切回 Docker backend 容器，需把 extra_hosts 移除并恢复 nginx.conf 的 backend:8000。
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  postgres:
    image: pgvector/pgvector:pg16
    container_name: inflow-db
    environment:
      # Keep database/user lowercase to match backend DSN and avoid
      # InvalidCatalogNameError (database "inflow" does not exist) on fresh volumes.
      POSTGRES_DB: inflow
      POSTGRES_USER: inflow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    ports:
      # 本地 worker 直连云端 PG 作任务总线。仅允许安全组白名单来源
      #（本地 Mac 公网 IP），切勿用 0.0.0.0/0 放行公网。
      - "0.0.0.0:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./03-src/backend/core/migrations:/docker-entrypoint-initdb.d:ro
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: inflow-redis
    ports:
      # backend 改为宿主直跑（直接代码部署），经 127.0.0.1 访问 redis 容器；仅本机回环，不暴露公网。
      - "127.0.0.1:6379:6379"
    restart: unless-stopped

  # ── backend / wechat-bot：Docker 形态已于 2026-08-20 移除 ──────────
  # backend 与 wechat-bot 由仓库根 start-server.sh 宿主机直跑。
  # 历史容器配置（build context / 挂载 / command）可从 git 历史找回。

  frontend:
    build:
      context: ./03-src/frontend
      dockerfile: Dockerfile
    container_name: inflow-frontend
    environment:
      NEXT_PUBLIC_API_URL: /api
      inFlow_ENV: production
    restart: unless-stopped

volumes:
  pgdata:
